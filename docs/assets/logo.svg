<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Ghostback Icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ghost-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer rounded squircle -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="url(#border-glow)" stroke-width="3"/>

  <!-- Subtle CRT scanline/grid texture -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="24" y1="64" x2="232" y2="64"/>
    <line x1="24" y1="96" x2="232" y2="96"/>
    <line x1="24" y1="128" x2="232" y2="128"/>
    <line x1="24" y1="160" x2="232" y2="160"/>
    <line x1="24" y1="192" x2="232" y2="192"/>
    <line x1="82" y1="48" x2="82" y2="236"/>
  </g>

  <!-- Terminal Window Header Bar -->
  <path d="M 10 60 L 246 60" stroke="#26334d" stroke-width="2"/>
  <circle cx="38" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="36" r="6" fill="#febc2e"/>
  <circle cx="78" cy="36" r="6" fill="#28c840"/>
  <rect x="104" y="27" width="112" height="18" rx="5" fill="#131c31" stroke="#2d3d5e" stroke-width="1"/>
  <text x="160" y="40" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">◈ ghostty</text>

  <!-- Left Docked Sidebar Indicator Strip -->
  <rect x="22" y="72" width="48" height="150" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
  <rect x="28" y="82" width="4" height="24" rx="2" fill="#34d399"/>
  <rect x="36" y="84" width="26" height="6" rx="3" fill="#34d399" opacity="0.85"/>
  <rect x="36" y="96" width="18" height="5" rx="2.5" fill="#475569"/>

  <rect x="28" y="116" width="4" height="24" rx="2" fill="#818cf8"/>
  <rect x="36" y="118" width="24" height="6" rx="3" fill="#818cf8" opacity="0.9"/>
  <rect x="36" y="130" width="20" height="5" rx="2.5" fill="#475569"/>

  <rect x="28" y="150" width="4" height="24" rx="2" fill="#f59e0b"/>
  <rect x="36" y="152" width="22" height="6" rx="3" fill="#f59e0b" opacity="0.85"/>
  <rect x="36" y="164" width="16" height="5" rx="2.5" fill="#475569"/>

  <!-- Right Main Workspace: Terminal Ghost + Prompt Cursor -->
  <g filter="url(#glow)">
    <!-- Geometric Terminal Ghost Silhouette -->
    <path d="M 116 118
             C 116 90, 188 90, 188 118
             L 188 182
             L 174 170
             L 160 182
             L 152 174
             L 144 182
             L 130 170
             L 116 182 Z"
          fill="url(#ghost-grad)" fill-opacity="0.16" stroke="url(#ghost-grad)" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Terminal Prompt ">_" as the Ghost's Eyes/Face -->
  <path d="M 131 120 L 143 128 L 131 136" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="151" y="131" width="18" height="5" rx="2" fill="#38bdf8"/>

  <!-- Loopback / Restore Arrow Badge at Bottom Right -->
  <rect x="100" y="196" width="122" height="26" rx="6" fill="#131c31" stroke="#334155" stroke-width="1.5"/>
  <text x="112" y="213" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">$ resume</text>
  <rect x="176" y="203" width="8" height="12" fill="#818cf8"/>
</svg>
