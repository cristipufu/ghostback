[package]
name = "ghostback"
version = "0.3.0"
edition = "2024"
description = "Native Ghostty session recovery, docked Herd fleet TUI, and cross-harness MCP agent orchestration."
license = "MIT"
authors = ["cristipufu"]
repository = "https://github.com/cristipufu/ghostback"
homepage = "https://github.com/cristipufu/ghostback"
keywords = ["ghostty", "claude", "codex", "mcp", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde"] }
libc = "0.2.191"
sha2 = "0.11.1"
jsonc-parser = { version = "0.34.0", features = ["cst"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
