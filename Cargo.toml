[package]
name = "ghostback"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Recover exact coding-agent conversations in native Ghostty terminals."
license = "MIT"
authors = ["cristipufu"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde"] }
libc = "0.2.191"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
